name: atos-infralegais-orgaos
on:
  pull_request:
    paths:
      - '.github/workflows/atos-infralegais-orgaos.yml'
      - 'scripts/atos_infralegais_orgaos.py'
      - 'scripts/nucleo_licitacoes.py'
      - 'tests/test_atos_infralegais_orgaos.py'
      - 'metadados/atos-infralegais-orgaos.json'
      - 'metadados/CONTRATO-atos-infralegais-orgaos.md'
      - 'provas/atos-infralegais-orgaos/**'
      - 'federal/br-federal-rdc-anvisa-*.md'
      - 'federal/br-federal-in-rfb-*.md'
      - 'federal/br-federal-resolucao-cmn-*.md'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install beautifulsoup4==4.15.0 lxml==6.1.3
      - name: Verify
        run: PYTHONPATH=scripts $RUNNER_TEMP/venv/bin/python scripts/atos_infralegais_orgaos.py verify
      - name: Unit tests
        run: PYTHONPATH=scripts $RUNNER_TEMP/venv/bin/python -m unittest tests.test_atos_infralegais_orgaos -v
