name: Núcleo federal benefícios / Maria da Penha

on:
  pull_request:
    paths:
      - '.github/workflows/nucleo-federal-beneficios-mdp.yml'
      - 'scripts/nucleo_federal_beneficios_mdp.py'
      - 'scripts/nucleo_licitacoes.py'
      - 'tests/test_nucleo_federal_beneficios_mdp.py'
      - 'provas/nucleo-federal-beneficios-mdp/**'
      - 'federal/br-federal-lei-1991-07-24-8213.md'
      - 'federal/br-federal-lei-2006-08-07-11340.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install beautifulsoup4==4.15.0 lxml==6.1.3
      - name: Reconverter snapshots e conferir Markdown/provas
        run: $RUNNER_TEMP/venv/bin/python scripts/nucleo_federal_beneficios_mdp.py verify
      - name: Cobertura fonte→Markdown e identidade
        run: $RUNNER_TEMP/venv/bin/python -m unittest tests.test_nucleo_federal_beneficios_mdp -v
