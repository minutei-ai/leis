name: Nordeste Lei 14.133
on:
  pull_request:
    paths:
      - '.github/workflows/nordeste-lei-14133.yml'
      - 'scripts/nordeste_lei_14133.py'
      - 'tests/test_nordeste_lei_14133.py'
      - 'metadados/nordeste-lei-14133/**'
      - 'provas/nordeste-lei-14133/**'
      - 'provas/regulamentacao-14133-ufs/CE/**'
      - 'provas/regulamentacao-14133-ufs/RN/**'
      - 'provas/regulamentacao-14133-ufs/SE/**'
      - 'provas/regulamentacao-14133-ufs/PI/**'
      - 'provas/regulamentacao-14133-ufs/PE/**'
      - 'provas/regulamentacao-14133-ufs/BA/**'
      - 'estaduais/CE/br-ce-decreto-2023-01-19-35283.md'
      - 'estaduais/RN/br-rn-decreto-2023-03-07-32449.md'
      - 'estaduais/SE/br-se-decreto-2023-06-28-342.md'
      - 'estaduais/PI/br-pi-decreto-2023-03-07-21872.md'
      - 'municipais/2304400/**'
      - 'municipais/2408102/**'
      - 'municipais/2507507/**'
      - 'municipais/2611606/**'
      - 'municipais/2704302/**'
      - 'municipais/2800308/**'
      - 'municipais/2927408/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verificar lote Nordeste (offline)
        run: python3 scripts/nordeste_lei_14133.py verify
      - name: Testes setoriais Nordeste
        run: python3 -m unittest tests.test_nordeste_lei_14133 -v
