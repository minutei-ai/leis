name: Núcleo CDC/ECA
on:
  pull_request:
    paths:
      - '.github/workflows/nucleo-cdc-eca.yml'
      - 'scripts/nucleo_cdc_eca.py'
      - 'scripts/nucleo_licitacoes.py'
      - 'tests/test_nucleo_cdc_eca.py'
      - 'metadados/nucleo-cdc-eca.json'
      - 'metadados/CONTRATO-cdc-eca.md'
      - 'provas/nucleo-cdc-eca/**'
      - 'federal/br-federal-lei-1990-09-11-8078.md'
      - 'federal/br-federal-lei-1990-07-13-8069.md'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils python3-venv
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install beautifulsoup4==4.15.0 lxml==6.1.3
      - name: Reconverter snapshots e conferir Markdown, provas e manifesto
        run: $RUNNER_TEMP/venv/bin/python scripts/nucleo_cdc_eca.py verify
      - name: Regressões do lote CDC/ECA
        run: $RUNNER_TEMP/venv/bin/python -m unittest tests.test_nucleo_cdc_eca -v
