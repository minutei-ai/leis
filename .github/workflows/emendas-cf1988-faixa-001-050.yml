name: Emendas CF1988 faixa 001–050
on:
  pull_request:
    paths:
      - '.github/workflows/emendas-cf1988-faixa-001-050.yml'
      - 'scripts/emendas_cf1988_faixa_001_050.py'
      - 'scripts/nucleo_licitacoes.py'
      - 'tests/test_emendas_cf1988_faixa_001_050.py'
      - 'provas/emendas-cf1988/faixa-001-050/**'
      - 'federal/br-federal-emenda-constitucional-*'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m venv "$RUNNER_TEMP/venv"
      - run: $RUNNER_TEMP/venv/bin/pip install beautifulsoup4==4.15.0 lxml==6.1.3
      - run: $RUNNER_TEMP/venv/bin/python scripts/emendas_cf1988_faixa_001_050.py verify
      - run: $RUNNER_TEMP/venv/bin/python -m unittest tests.test_emendas_cf1988_faixa_001_050 -v
