name: Constituições estaduais e inventários locais
on:
  pull_request:
    paths:
      - '.github/workflows/constituicoes-estaduais-lote.yml'
      - 'tests/test_constituicoes_estaduais_lote.py'
      - 'metadados/constituicoes-estaduais/**'
      - 'metadados/licitacoes-locais/index.json'
      - 'metadados/regulamentacao-14133-ufs/**'
      - 'metadados/capitais-lei-organica-14133/**'
      - 'provas/constituicoes-estaduais/**'
      - 'estaduais/DF/br-df-lei-organica-1993-06-08.md'
      - 'estaduais/SC/br-sc-constituicao-1989.md'
      - 'estaduais/BA/br-ba-norma-27298.md'
      - 'municipais/3106200/br-municipal-3106200-decreto-2021-12-21-17813.md'
      - 'municipais/3106200/br-municipal-3106200-decreto-2022-09-20-18096.md'
      - 'municipais/3106200/br-municipal-3106200-decreto-2023-01-19-18240.md'
      - 'municipais/3106200/br-municipal-3106200-decreto-2023-01-25-18242.md'
      - 'metadados/licitacoes-locais/MG.json'
      - 'provas/licitacoes-locais/MG/**'
      - 'scripts/nucleo_licitacoes.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install beautifulsoup4==4.15.0 lxml==6.1.3
      - name: Regressões constituições / inventários #57 #73 #86 #101
        run: $RUNNER_TEMP/venv/bin/python -m unittest tests.test_constituicoes_estaduais_lote -v
