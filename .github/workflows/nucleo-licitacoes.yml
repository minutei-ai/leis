name: Núcleo de licitações
on:
  pull_request:
    paths:
      - '.github/workflows/nucleo-licitacoes.yml'
      - 'scripts/nucleo_licitacoes.py'
      - 'tests/test_nucleo_licitacoes.py'
      - 'tests/test_decretos_atualizacao_14133.py'
      - 'metadados/nucleo-licitacoes.json'
      - 'metadados/CONTRATO.md'
      - 'provas/nucleo-licitacoes/**'
      - 'federal/br-federal-lei-2021-04-01-14133.md'
      - 'federal/edicoes/br-federal-lei-2021-04-01-14133-consolidada.md'
      - 'federal/edicoes/br-federal-lei-complementar-2006-12-14-123-planalto.md'
      - 'federal/br-federal-lei-2016-06-30-13303.md'
      - 'federal/br-federal-lei-1993-06-21-8666.md'
      - 'federal/br-federal-lei-2002-07-17-10520.md'
      - 'federal/br-federal-lei-complementar-2006-12-14-123.md'
      - 'federal/br-federal-lei-complementar-2026-01-13-227.md'
      - 'federal/br-federal-lei-complementar-2026-10-21-238.md'
      - 'federal/br-federal-decreto-2021-12-30-10922.md'
      - 'federal/br-federal-decreto-2022-12-29-11317.md'
      - 'federal/br-federal-decreto-2023-12-29-11871.md'
      - 'federal/br-federal-decreto-2024-12-30-12343.md'
      - 'federal/br-federal-decreto-2025-12-29-12807.md'
      - 'provas/decretos-atualizacao-14133/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils python3-venv
      # Versões fixas: a conversão HTML depende do analisador (libxml2) embutido no lxml.
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install beautifulsoup4==4.15.0 lxml==6.1.3
      - name: Reconverter os snapshots e conferir Markdown, provas e manifesto
        run: $RUNNER_TEMP/venv/bin/python scripts/nucleo_licitacoes.py verify
      - name: Regressões do núcleo
        run: $RUNNER_TEMP/venv/bin/python -m unittest tests.test_nucleo_licitacoes tests.test_decretos_atualizacao_14133 -v
