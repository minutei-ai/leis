name: Licitações locais SP
on:
  pull_request:
    paths:
      - '.github/workflows/licitacoes-locais-SP.yml'
      - 'tests/test_licitacoes_locais_SP.py'
      - 'metadados/licitacoes-locais/SP.json'
      - 'provas/licitacoes-locais/SP/**'
      - 'municipais/3550308/br-municipal-3550308-decreto-2022-12-27-62100.md'
      - 'estaduais/SP/br-sp-norma-207462.md'
      - 'scripts/nucleo_licitacoes.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install beautifulsoup4==4.15.0 lxml==6.1.3
      - name: Regressões do catálogo local SP
        run: $RUNNER_TEMP/venv/bin/python -m unittest tests.test_licitacoes_locais_SP -v
