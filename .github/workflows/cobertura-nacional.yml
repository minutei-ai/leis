name: Cobertura nacional e metadados BM25
on:
  pull_request:
    paths:
      - '.github/workflows/cobertura-nacional.yml'
      - 'scripts/cobertura_nacional.py'
      - 'tests/test_cobertura_nacional.py'
      - 'metadados/CONTRATO-acervo.md'
      - 'metadados/acervo-geral-piloto.json'
      - 'provas/cobertura-nacional/**'
      - 'assets/federal/br-federal-decreto-lei-1941-10-03-3689/**'
      - 'federal/br-federal-decreto-lei-1941-10-03-3689.md'
      - 'federal/br-federal-lei-2002-01-10-10406.md'
      - 'federal/br-federal-lei-2015-03-16-13105.md'
      - 'estaduais/AC/br-ac-norma-1121.md'
      - 'estaduais/AC/br-ac-norma-120.md'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Export sidecar JSONL do acervo (streaming, retomável)
        run: python3 scripts/cobertura_nacional.py export-acervo --no-resume --shard-size 10000
      - name: Verificar inventários, contrato e export BM25 offline
        run: python3 scripts/cobertura_nacional.py verify
      - name: Regressões
        run: python3 -m unittest tests.test_cobertura_nacional -v
