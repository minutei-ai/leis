name: Licitações locais PR
on:
  pull_request:
    paths:
      - '.github/workflows/licitacoes-locais-pr.yml'
      - 'tests/test_licitacoes_locais_pr.py'
      - 'metadados/licitacoes-locais/PR.json'
      - 'provas/licitacoes-locais/PR/**'
      - 'estaduais/PR/br-pr-ato-259084.md'
      - 'scripts/nucleo_licitacoes.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install beautifulsoup4==4.15.0 lxml==6.1.3
      - name: Regressões PR Decreto 10.086/2022
        run: $RUNNER_TEMP/venv/bin/python -m unittest tests.test_licitacoes_locais_pr -v
