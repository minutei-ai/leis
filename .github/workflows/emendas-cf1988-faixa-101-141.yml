      - 'scripts/nucleo_licitacoes.py'
      - 'tests/test_emendas_cf1988_faixa_101_141.py'
      - 'provas/emendas-cf1988/faixa-101-141/**'
      - 'federal/br-federal-emenda-constitucional-*-102.md'
