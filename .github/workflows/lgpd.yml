name: Edições LGPD
on:
  pull_request:
    paths:
      - '.github/workflows/lgpd.yml'
      - 'scripts/lgpd.py'
      - 'scripts/nucleo_licitacoes.py'
      - 'tests/test_lgpd.py'
      - 'provas/lgpd/**'
      - 'metadados/lgpd.json'
      - 'metadados/CONTRATO-lgpd.md'
      - 'federal/br-federal-lei-2018-08-14-13709.md'
      - 'federal/edicoes/br-federal-lei-2018-08-14-13709-consolidada.md'
      - 'federal/br-federal-lei-2026-02-25-15352.md'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m venv "$RUNNER_TEMP/venv"
      - run: $RUNNER_TEMP/venv/bin/pip install beautifulsoup4==4.15.0 lxml==6.1.3
      - run: $RUNNER_TEMP/venv/bin/python scripts/lgpd.py verify
      - run: $RUNNER_TEMP/venv/bin/python -m unittest tests.test_lgpd -v
