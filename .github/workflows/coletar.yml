name: Ampliar acervo oficial
on:
  workflow_dispatch:
    inputs:
      limite:
        description: Máximo de novas tentativas por fonte neste lote
        type: number
        default: 1000
  schedule:
    - cron: '15 */6 * * *'
permissions:
  contents: write
concurrency:
  group: coleta-acervo
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      BATCH_LIMIT: ${{ github.event_name == 'schedule' && 1000 || inputs.limite }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Descobrir todas as famílias federais suportadas
        continue-on-error: true
        timeout-minutes: 90
        run: bun run discover --all
      - name: Descobrir legislação mineira desde 1947
        continue-on-error: true
        run: bun run collect:almg --from 1947 --discover-only
      - name: Descobrir todas as páginas paulistas
        continue-on-error: true
        run: bun run collect:alesp --discover-only --refresh
      - name: Descobrir leis municipais de São Paulo
        continue-on-error: true
        run: bun run collect:pmsp --discover-only
      - name: Descobrir leis e constituições baianas
        continue-on-error: true
        timeout-minutes: 45
        run: bun run collect:bahia --discover-only --pages 100
      - name: Atualizar catálogos federais do ano corrente
        continue-on-error: true
        run: |
          CORPUS_YEAR=$(date -u +%Y)
          bun run discover --all --from "$CORPUS_YEAR" --to "$CORPUS_YEAR" --refresh
      - name: Atualizar catálogo mineiro do ano corrente
        continue-on-error: true
        run: |
          CORPUS_YEAR=$(date -u +%Y)
          bun run collect:almg --from "$CORPUS_YEAR" --to "$CORPUS_YEAR" --discover-only --refresh
      - name: Atualizar catálogo municipal do ano corrente
        continue-on-error: true
        run: |
          CORPUS_YEAR=$(date -u +%Y)
          bun run collect:pmsp --from "$CORPUS_YEAR" --to "$CORPUS_YEAR" --discover-only --refresh
      - name: Coletar novo lote federal
        continue-on-error: true
        run: bun run collect:senado --limit "$BATCH_LIMIT" --skip-failures
      - name: Coletar novo lote mineiro
        continue-on-error: true
        run: bun run collect:almg --from 1947 --limit "$BATCH_LIMIT" --skip-failures
      - name: Coletar novo lote paulista
        continue-on-error: true
        run: bun run collect:alesp --limit "$BATCH_LIMIT" --skip-failures
      - name: Coletar novo lote municipal de São Paulo
        continue-on-error: true
        run: bun run collect:pmsp --limit "$BATCH_LIMIT" --skip-failures
      - name: Coletar novo lote baiano
        continue-on-error: true
        run: bun run collect:bahia --limit "$BATCH_LIMIT" --skip-failures
      - name: Reavaliar até 100 falhas federais mais antigas
        continue-on-error: true
        run: bun run collect:senado --limit 100 --only-failures
      - name: Reavaliar até 100 falhas mineiras mais antigas
        continue-on-error: true
        run: bun run collect:almg --from 1947 --limit 100 --only-failures
      - name: Reavaliar até 100 falhas paulistas mais antigas
        continue-on-error: true
        run: bun run collect:alesp --limit 100 --only-failures
      - name: Reavaliar até 100 falhas municipais mais antigas
        continue-on-error: true
        run: bun run collect:pmsp --limit 100 --only-failures
      - name: Reavaliar até 100 falhas baianas mais antigas
        continue-on-error: true
        run: bun run collect:bahia --limit 100 --only-failures
      - run: bun run check
      - run: bun run audit
      - run: bun run coverage
      - name: Publicar somente o lote auditado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nenhum arquivo novo ou alterado; confira as pendências em COBERTURA.md.'
            exit 0
          fi
          git commit -q -m 'Atualiza lote auditado de fontes oficiais'
          git push origin HEAD:main
