name: Núcleo federal CTN / SUS

on:
  pull_request:
    paths:
      - '.github/workflows/nucleo-federal-ctn-sus.yml'
      - 'scripts/nucleo_federal_ctn_sus.py'
      - 'scripts/nucleo_licitacoes.py'
      - 'tests/test_nucleo_federal_ctn_sus.py'
      - 'provas/nucleo-federal-ctn-sus/**'
      - 'federal/br-federal-lei-1966-10-25-5172.md'
      - 'federal/br-federal-lei-1990-09-19-8080.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install beautifulsoup4==4.15.0 lxml==6.1.3
      - name: Reconverter snapshots e conferir Markdown/provas
        run: $RUNNER_TEMP/venv/bin/python scripts/nucleo_federal_ctn_sus.py verify
      - name: Cobertura fonte→Markdown e identidade
        run: $RUNNER_TEMP/venv/bin/python -m unittest tests.test_nucleo_federal_ctn_sus -v
