name: MPs EC32 / decretos-leis (#84 #95 #96)

on:
  pull_request:
    paths:
      - '.github/workflows/mps-ec32-decretos-leis.yml'
      - 'scripts/mps_pos_ec32.py'
      - 'scripts/mps_pre_ec32.py'
      - 'scripts/decretos_leis_lacunas.py'
      - 'scripts/mps_anexo_recovery.py'
      - 'scripts/nucleo_licitacoes.py'
      - 'tests/test_mps_pos_ec32.py'
      - 'tests/test_mps_pre_ec32.py'
      - 'tests/test_decretos_leis_lacunas.py'
      - 'provas/mps-pos-ec32/**'
      - 'provas/mps-pre-ec32/**'
      - 'provas/decretos-leis-lacunas/**'
      - 'federal/br-federal-medida-provisoria-*.md'
      - 'federal/br-federal-decreto-lei-*.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv libreoffice-writer
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install beautifulsoup4==4.15.0 lxml==6.1.3
      - name: Verify MPs pós-EC32
        run: $RUNNER_TEMP/venv/bin/python scripts/mps_pos_ec32.py verify
      - name: Verify MPs pré-EC32
        run: $RUNNER_TEMP/venv/bin/python scripts/mps_pre_ec32.py verify
      - name: Verify decretos-leis
        run: $RUNNER_TEMP/venv/bin/python scripts/decretos_leis_lacunas.py verify
      - name: Unit tests
        run: >
          $RUNNER_TEMP/venv/bin/python -m unittest
          tests.test_mps_pos_ec32
          tests.test_mps_pre_ec32
          tests.test_decretos_leis_lacunas -v
