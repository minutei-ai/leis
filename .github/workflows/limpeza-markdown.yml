name: Limpeza Markdown (#87 #98 #100)

on:
  pull_request:
    paths:
      - '.github/workflows/limpeza-markdown.yml'
      - '.github/workflows/nucleo-licitacoes.yml'
      - '.github/workflows/lgpd.yml'
      - '.github/workflows/nucleo-federal-beneficios-mdp.yml'
      - 'scripts/limpeza_markdown.py'
      - 'scripts/nucleo_licitacoes.py'
      - 'scripts/lgpd.py'
      - 'scripts/nucleo_federal_beneficios_mdp.py'
      - 'tests/test_limpeza_markdown.py'
      - 'metadados/limpeza-markdown/**'
      - 'provas/limpeza-markdown/**'
      - 'assets/md-inline/**'
      - 'federal/br-federal-lei-2016-06-30-13303.md'
      - 'federal/br-federal-lei-2018-08-14-13709.md'
      - 'federal/edicoes/br-federal-lei-2018-08-14-13709-consolidada.md'
      - 'federal/br-federal-lei-complementar-2006-12-14-123.md'
      - 'federal/br-federal-lei-2006-08-07-11340.md'
      - 'estaduais/GO/**'
      - 'estaduais/PA/**'
      - 'estaduais/ES/**'
      - 'municipais/5208707/**'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deps do gerador (teste CEDI)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install beautifulsoup4==4.15.0 lxml==6.1.3
      - name: Unit + adversarial da limpeza
        run: $RUNNER_TEMP/venv/bin/python -m unittest tests.test_limpeza_markdown.LimpezaUnit tests.test_limpeza_markdown.LimpezaRunAccounting -v

  corpus-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - name: Gates de corpus (marcadores / data:image / portais / HTML)
        run: python3 -m unittest tests.test_limpeza_markdown.LimpezaCorpusGates -v

  dependents:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils python3-venv ripgrep
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install beautifulsoup4==4.15.0 lxml==6.1.3
      - name: Verify núcleo licitações e suas edições conferidas
        run: $RUNNER_TEMP/venv/bin/python scripts/nucleo_licitacoes.py verify
      - name: Verify LGPD
        run: $RUNNER_TEMP/venv/bin/python scripts/lgpd.py verify
      - name: Verify benefícios / Maria da Penha
        run: $RUNNER_TEMP/venv/bin/python scripts/nucleo_federal_beneficios_mdp.py verify
      - name: Preservação exata das edições conferidas pendentes de limpeza
        run: $RUNNER_TEMP/venv/bin/python -m unittest tests.test_limpeza_markdown.LimpezaCorpusGates.test_later_reviewed_editions_are_preserved_by_exact_hash -v
