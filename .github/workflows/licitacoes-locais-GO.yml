name: Licitações locais GO
on:
  pull_request:
    paths:
      - '.github/workflows/licitacoes-locais-GO.yml'
      - 'tests/test_licitacoes_locais_GO.py'
      - 'metadados/licitacoes-locais/GO.json'
      - 'provas/licitacoes-locais/GO/**'
      - 'municipais/5208707/br-municipal-5208707-decreto-2024-06-25-2469.md'
      - 'estaduais/GO/br-go-norma-106877.md'
      - 'scripts/nucleo_licitacoes.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils python3-venv
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install beautifulsoup4==4.15.0 lxml==6.1.3
      - name: Regressões do catálogo local GO
        run: $RUNNER_TEMP/venv/bin/python -m unittest tests.test_licitacoes_locais_GO -v
      - name: Integridade e contagens do acervo
        run: $RUNNER_TEMP/venv/bin/python scripts/verify-dou-assets.py
