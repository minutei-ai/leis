name: Emendas CF/1988 série 1–141

on:
  pull_request:
    paths:
      - '.github/workflows/emendas-cf1988-serie-1-141.yml'
      - 'scripts/emendas_cf1988_serie_1_141.py'
      - 'tests/test_emendas_cf1988_serie_1_141.py'
      - 'provas/emendas-cf1988/serie-1-141/**'
      - 'federal/br-federal-emenda-constitucional-*.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verificar matriz da série 1–141
        run: python3 scripts/emendas_cf1988_serie_1_141.py verify
      - name: Cobertura por identidade
        run: python3 -m unittest tests.test_emendas_cf1988_serie_1_141 -v
