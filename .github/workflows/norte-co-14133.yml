name: Norte/CO Lei 14.133
on:
  pull_request:
    paths:
      - '.github/workflows/norte-co-14133.yml'
      - 'tests/test_norte_co_14133.py'
      - 'scripts/norte_co_14133.py'
      - 'scripts/nucleo_licitacoes.py'
      - 'metadados/norte-co-14133/**'
      - 'provas/norte-co-14133/**'
      - 'estaduais/AC/br-ac-decreto-2023-11-22-11363.md'
      - 'estaduais/MT/br-mt-decreto-2022-11-23-1525.md'
      - 'estaduais/MS/br-ms-decreto-2023-03-09-16122.md'
      - 'estaduais/AP/br-ap-decreto-2023-03-08-1716.md'
      - 'estaduais/TO/br-to-decreto-2023-03-28-6606.md'
      - 'estaduais/AM/br-am-decreto-2023-03-10-47133.md'
      - 'estaduais/DF/br-df-decreto-2023-03-16-44330.md'
      - 'estaduais/DF/br-df-lei-organica-1993-06-08.md'
      - 'municipais/1100205/**'
      - 'municipais/1400100/**'
      - 'municipais/1302603/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install beautifulsoup4==4.15.0 lxml==6.1.3
      - name: Verify inventário Norte/CO 14.133
        run: $RUNNER_TEMP/venv/bin/python scripts/norte_co_14133.py verify
      - name: Testes setoriais Norte/CO 14.133
        run: $RUNNER_TEMP/venv/bin/python -m unittest tests.test_norte_co_14133 -v
