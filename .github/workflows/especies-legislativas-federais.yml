name: Espécies legislativas federais (DLG/RSF/RCD/RCN)

on:
  pull_request:
    paths:
      - '.github/workflows/especies-legislativas-federais.yml'
      - 'scripts/especies_legislativas_federais.py'
      - 'scripts/nucleo_licitacoes.py'
      - 'tests/test_especies_legislativas_federais.py'
      - 'provas/especies-legislativas-federais/**'
      - 'federal/br-federal-decreto-legislativo-*.md'
      - 'federal/br-federal-resolucao-senado-federal-*.md'
      - 'federal/br-federal-resolucao-camara-deputados-*.md'
      - 'federal/br-federal-resolucao-congresso-nacional-*.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install beautifulsoup4==4.15.0 lxml==6.1.3
      - name: Verificar catálogos, reconciliacao e Markdown
        run: $RUNNER_TEMP/venv/bin/python scripts/especies_legislativas_federais.py verify
      - name: Cobertura por identidade
        run: $RUNNER_TEMP/venv/bin/python -m unittest tests.test_especies_legislativas_federais -v
