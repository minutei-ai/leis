name: Licitações locais MG
on:
  pull_request:
    paths:
      - '.github/workflows/licitacoes-locais-mg.yml'
      - 'scripts/licitacoes_locais_mg.py'
      - 'tests/test_licitacoes_locais_mg.py'
      - 'metadados/licitacoes-locais/MG.json'
      - 'provas/licitacoes-locais/MG/**'
      - 'municipais/3106200/br-municipal-3106200-decreto-2023-03-28-18289.md'
      - 'municipais/3106200/br-municipal-3106200-decreto-2021-12-21-17813.md'
      - 'municipais/3106200/br-municipal-3106200-decreto-2022-09-20-18096.md'
      - 'municipais/3106200/br-municipal-3106200-decreto-2023-01-19-18240.md'
      - 'municipais/3106200/br-municipal-3106200-decreto-2023-01-25-18242.md'
      - 'estaduais/MG/br-mg-decreto-2023-11-24-48723.md'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install beautifulsoup4==4.15.0 lxml==6.1.3
      - name: Verificar conversão e provas do Decreto BH 18.289
        run: $RUNNER_TEMP/venv/bin/python scripts/licitacoes_locais_mg.py verify
      - name: Testes MG licitações locais
        run: $RUNNER_TEMP/venv/bin/python -m unittest tests.test_licitacoes_locais_mg -v
