name: Federal decretos 8001–9000

on:
  pull_request:
    paths:
      - '.github/workflows/federal-decretos-8001-9000.yml'
      - 'scripts/federal_decretos_8001_9000.py'
      - 'scripts/nucleo_licitacoes.py'
      - 'tests/test_federal_decretos_8001_9000.py'
      - 'provas/federal-decretos-8001-9000/**'
      - 'provas/federal-lacunas-catalogo/**'
      - 'federal/br-federal-decreto-2013-09-04-8100.md'
      - 'federal/br-federal-decreto-2014-08-29-8300.md'
      - 'federal/br-federal-decreto-2015-08-12-8500.md'
      - 'federal/br-federal-decreto-2015-12-18-8600.md'
      - 'federal/br-federal-decreto-2016-03-30-8700.md'
      - 'federal/br-federal-decreto-2016-07-06-8800.md'
      - 'federal/br-federal-decreto-2016-11-10-8900.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install beautifulsoup4==4.15.0 lxml==6.1.3
      - name: Reconverter snapshots e conferir Markdown/provas
        run: $RUNNER_TEMP/venv/bin/python scripts/federal_decretos_8001_9000.py verify
      - name: Cobertura do lote amostral de decretos #81
        run: $RUNNER_TEMP/venv/bin/python -m unittest tests.test_federal_decretos_8001_9000 -v
