name: atualizacao-planalto-licitacao
on:
  push:
    paths:
      - 'federal/br-federal-decreto-2022-10-27-11246.md'
      - 'federal/br-federal-decreto-2024-01-09-11878.md'
      - 'federal/br-federal-lei-2011-11-18-12527.md'
      - 'federal/br-federal-lei-2011-08-04-12462.md'
      - 'scripts/atualizacao_planalto_licitacao.py'
      - 'provas/atualizacao-planalto-licitacao/**'
      - 'metadados/atualizacao-planalto-licitacao.json'
      - 'metadados/CONTRATO-atualizacao-planalto-licitacao.md'
      - 'tests/test_atualizacao_planalto_licitacao.py'
      - '.github/workflows/atualizacao-planalto-licitacao.yml'
  pull_request:
    paths:
      - 'federal/br-federal-decreto-2022-10-27-11246.md'
      - 'federal/br-federal-decreto-2024-01-09-11878.md'
      - 'federal/br-federal-lei-2011-11-18-12527.md'
      - 'federal/br-federal-lei-2011-08-04-12462.md'
      - 'scripts/atualizacao_planalto_licitacao.py'
      - 'provas/atualizacao-planalto-licitacao/**'
      - 'metadados/atualizacao-planalto-licitacao.json'
      - 'metadados/CONTRATO-atualizacao-planalto-licitacao.md'
      - 'tests/test_atualizacao_planalto_licitacao.py'
      - '.github/workflows/atualizacao-planalto-licitacao.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install beautifulsoup4 lxml
      - name: Verify lote
        run: python3 scripts/atualizacao_planalto_licitacao.py verify
      - name: Unit tests
        run: python3 -m unittest tests.test_atualizacao_planalto_licitacao -v
