name: Federal prioridade 5000–11999

on:
  pull_request:
    paths:
      - '.github/workflows/federal-prioridade-5000-11999.yml'
      - 'scripts/federal_prioridade_5000_11999.py'
      - 'scripts/nucleo_licitacoes.py'
      - 'tests/test_federal_prioridade_5000_11999.py'
      - 'provas/federal-prioridade-5000-11999/**'
      - 'federal/br-federal-lei-*.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install beautifulsoup4==4.15.0 lxml==6.1.3
      - name: Reconverter snapshots e conferir Markdown/provas
        run: $RUNNER_TEMP/venv/bin/python scripts/federal_prioridade_5000_11999.py verify
      - name: Cobertura fonte→Markdown do lote prioritário e série
        run: $RUNNER_TEMP/venv/bin/python -m unittest tests.test_federal_prioridade_5000_11999 -v
