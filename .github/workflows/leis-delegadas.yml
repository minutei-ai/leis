name: Leis delegadas federais

on:
  pull_request:
    paths:
      - '.github/workflows/leis-delegadas.yml'
      - 'scripts/leis_delegadas.py'
      - 'scripts/nucleo_licitacoes.py'
      - 'tests/test_leis_delegadas.py'
      - 'provas/leis-delegadas/**'
      - 'federal/br-federal-lei-delegada-*.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install beautifulsoup4==4.15.0 lxml==6.1.3
      - name: Reconverter snapshots e conferir Markdown/provas
        run: $RUNNER_TEMP/venv/bin/python scripts/leis_delegadas.py verify
      - name: Cobertura por identidade do catálogo e fonte→Markdown
        run: $RUNNER_TEMP/venv/bin/python -m unittest tests.test_leis_delegadas -v
